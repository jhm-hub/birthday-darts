<!doctype html><html lang="en" class="overlay-page"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faith Darts — transparent widget</title><link rel="stylesheet" href="./widget-demo.css"><script type="module" src="./player.js"></script></head><body data-connection="connecting"><p id="display-help" hidden>Open your game’s controls and use its private display link.</p><div class="overlay-screen" id="screen"><div class="widget-anchor" id="widget-anchor"><section class="widget" id="widget" aria-label="Darts overlay" aria-hidden="true">
