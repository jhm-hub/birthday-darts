<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piñata Party — animation close-up</title><link rel="stylesheet" href="./pinata.css"><link rel="stylesheet" href="./pinata-view.css"><script type="module" src="./pinata-art-preview.js"></script></head>
<body><main class="shell control-shell"><header class="topbar"><a href="./pinata.html">← Play Piñata Party</a><span class="badge">ANIMATION CLOSE-UP</span></header><section class="hero"><div><p class="eyebrow">CANDY CONFETTI · ART PASS</p><h1>A little more impact.</h1><p>Watch the wind-up, contact and candy burst at your own pace.</p></div></section><section class="panel"><div class="preview-wrap" data-bg="dark"><div class="pinata-screen" id="art-preview"></div></div><div class="preview-tools"><label>Scene <select id="scene"><option value="hit">First hit</option><option value="break">Final break</option></select></label><label>Backdrop <select id="backdrop"><option value="dark">Dark stream</option><option value="light">Light room</option><option value="checker">Transparency</option></select></label></div><div class="small-actions"><button id="replay" class="primary">Replay</button><button id="pause">Play</button><label>Speed <select id="speed"><option value="1">Normal</option><option value="0.5">Half speed</option><option value="0.25">Quarter speed</option></select></label></div><label for="time">Animation time <output id="time-label">0.00s</output></label><input id="time" type="range" min="0" max="3400" value="0" step="1"><div class="small-actions"><button data-time="260">Wind-up</button><button data-time="500">Contact</button><button data-time="1040">Candy burst</button><button data-time="1750">Total</button></div><label><input id="quiet" type="checkbox"> Reduced motion</label><p class="hint">Silent art preview. These samples never change saved games or viewer rounds. Use Sound on in the main game to hear a complete round.</p></section></main></body></html>
